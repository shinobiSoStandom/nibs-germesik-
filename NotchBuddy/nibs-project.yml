name: NIBSGermesik
options:
  deploymentTarget:
    macOS: "15.0"
packages:
  FluidAudio:
    path: ../.nibs-build/dependencies/FluidAudio
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: YES
schemes:
  NIBSGermesik:
    build:
      targets:
        NIBSGermesik: all
targets:
  NIBSGermesik:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: ["Phone/**", "Widgets/**", "NotificationContent/**"]
      - path: Assets.xcassets
      - path: Resources/sounds
        type: folder
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/whats-new.json
        buildPhase: resources
    dependencies:
      - package: FluidAudio
    info:
      path: Resources/NIBS-Info.plist
      properties:
        CFBundleName: NIBS Germesik
        CFBundleDisplayName: NIBS Гермесик
        CFBundleIdentifier: com.nibs.germesik
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "1"
        LSUIElement: false
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: Гермесик использует микрофон для диктовки по вашему запросу.
        NSSpeechRecognitionUsageDescription: Гермесик преобразует речь в текст по вашему запросу.
        NSAudioCaptureUsageDescription: Запись звука встречи запускается только вами.
        NSContactsUsageDescription: Поиск контакта по вашему запросу.
    settings:
      base:
        PRODUCT_NAME: NIBS Germesik
        PRODUCT_BUNDLE_IDENTIFIER: com.nibs.germesik
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
